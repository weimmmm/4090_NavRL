defaults:
  - _self_
  - drone
  - sim

headless: True
# Override at launch to select a GPU, for example: device=cuda:7
device: "cuda:0"
seed: 0
dataset_output: ""

# Dataset-to-Isaac replay.  The replay script reads recorded references and
# feeds them directly to the original Lee controller; it never creates SUPER.
replay:
  manifest_path: training/data/manifest.json
  scene_id: ""
  obstacle_count: -1
  num_episodes: 4
  random_seed: 20261001
  output_dir: training/data/replay
  # full_reference: recorded p/v/a are sent to Lee directly.
  # velocity_adapter: recompute the exactly equivalent Lee target velocity
  # from the recorded p/v/a reference and the current simulated position.
  # velocity_trajectory_adapter: consume only recorded 3-D reference velocity;
  # integrate p_ref and finite-difference a_ref online.
  control_mode: full_reference
  # recorded: replay the measured expert yaw; velocity_heading: derive yaw
  # deterministically from the 3-D reference velocity; none: preserve yaw.
  yaw_mode: recorded
  yaw_speed_threshold: 0.2
  max_yaw_rate: 2.5

# SUPER evaluation does not train a policy.
record_eval_video: false
dynamic_observation_count: 1

# Training Environment
env:
  num_envs: 1
  max_episode_length: 2500
  # Optional deterministic scene generated by generate_fixed_environments.py.
  scene_path: ""
  # Alternatively, build a deterministic collection scene in memory.  This
  # keeps the dataset reproducible without writing a .pt or map artifact.
  runtime_scene_id: ""
  map_seed: 0
  route_seed: 0
  # All clones use the same Isaac world coordinates. Physics collision groups
  # isolate them, and RayCaster only queries the terrain mesh.
  env_spacing: 0.0
  num_obstacles: 350
  # Evaluation route across the 40 m x 40 m obstacle field.
  # The obstacle field is 40x40 m (x/y in [-20, 20]); its 5 m terrain border
  # makes the complete valid flight area [-25, 25].
  world_half_extent: 25.0
  # Four balanced crossing directions.  Start/goal lateral coordinates are
  # sampled independently and uniformly on opposite edges.
  eval_edge: 24.0
  eval_route_offset: 0
  # Evaluation-only selection from saved start/goal/orientation rows; map is unchanged.
  fixed_route_start_index: 0
  # A trajectory is successful only after entering the goal region and
  # remaining nearly stopped for this many consecutive physics steps.
  success_distance: 0.5
  success_speed: 0.2
  success_stop_steps: 10

env_dyn:
  num_obstacles: 0
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

super:
  # Feed SUPER's raw desired velocity through the original PPO-to-Lee
  # interface. Alternatives include velocity_mpc, velocity_only,
  # velocity_yaw, and full_reference.
  lee_input_mode: velocity_adapter
  velocity_adapter:
    position_gain: 1.2
    acceleration_preview_s: 0.25
    # Track a near-future point on SUPER's committed trajectory without
    # changing the planner speed or the Lee controller update rate.
    lookahead_s: 0.0
    max_position_correction_mps: 1.2
    # Normalize the final world-frame command to a strict 2 m/s upper bound.
    max_speed_mps: 2.0
    max_acceleration_mps2: 4.0
    # Brake late enough to preserve transit speed, then use measured-velocity
    # feedback to settle inside the strict 0.5 m / 0.2 m/s success window.
    goal_capture_radius_m: 2.0
    goal_capture_gain: 2.0
    goal_capture_velocity_damping: 1.2
    goal_capture_max_speed_mps: 1.5
    static_obstacle_safety:
      enabled: true
      activation_distance_m: 1.0
      clearance_m: 0.38
      approach_gain: 2.0
      velocity_damping_gain: 0.4
      max_obstacles: 4
      projection_passes: 2
      preserve_speed: true
    planner_recovery:
      enabled: true
      delay_steps: 10
      speed_mps: 2.0
      lookahead_m: 3.0
      candidate_count: 37
      heading_weight: 0.12
      continuity_weight: 0.25
      static_grid_astar:
        enabled: true
        # Let local steering bridge brief replanning gaps.  Persistent gaps
        # switch to a deterministic scene-level route after 1.6 seconds.
        delay_steps: 100
        resolution_m: 0.4
        clearance_m: 0.32
        waypoint_radius_m: 0.75
    obstacle_steering:
      enabled: false
      candidate_count: 13
      max_heading_offset_deg: 75.0
      lookahead_m: 2.5
      corridor_radius_m: 0.45
      vertical_half_extent_m: 0.45
      obstacle_cost: 4.0
      heading_cost: 0.5
  # Batched receding-horizon outer loop.  It emits the same world-frame
  # 3-D velocity contract as PPO/WAM and leaves the Lee controller untouched.
  velocity_mpc:
    horizon_steps: 20
    velocity_time_constant_s: 0.18
    position_weight: 8.0
    velocity_weight: 2.0
    command_weight: 0.15
    smoothness_weight: 0.8
    terminal_weight: 4.0
    max_speed_mps: 2.0
    max_acceleration_mps2: 4.0
    safety_projection:
      # Experimental: local single-surface projection was less reliable than
      # SUPER's globally planned direction in the dense 350-obstacle scene.
      enabled: false
      activation_distance_m: 1.2
      clearance_m: 0.45
      approach_gain: 2.0
      vertical_half_extent_m: 0.6
      max_points: 1
  config_path: super_planner.yaml
  replan_interval_steps: 10
  map_update_interval_steps: 10
  map_warmup_updates: 3
  # The scene is deterministic and contains only static obstacles.  Seed the
  # shared fixed ROG-Map once, then keep fusing the unchanged LiDAR stream.
  prefill_static_map: true
  prefill_surface_resolution_m: 0.10
  lidar_min_range: 0.30
  lidar_max_range_margin: 0.05
  goal_yaw_mode: direction
  fallback_hover: true
  save_run_data: true
  data_log_path: super_logs/super_run.npz
  metrics_path: super_logs/super_metrics.json
  trajectory_path: super_logs/super_trajectory.npz
  map_path: super_logs/super_map.npz
  post_finish_steps: 200
# Closed-loop dual-DiT evaluation.  Action-DiT emits ten yaw-only ego-frame
# velocity commands; each is rotated into world ENU and sent to the original
# unmodified Lee controller at the 0.016 s physics rate.
wam_eval:
  # Inference-only ablation for SuperActionExpertModel. The default preserves
  # the existing deterministic deployment and checkpoint format unchanged.
  action_generation: auto
  checkpoint: training/lidar_WAM/outputs/super_history_world_action_dit_t1/best.pt
  world_checkpoint: training/lidar_WAM/outputs/super_lidar_video_dit_t1/best.pt
  sample_steps: 10
  # Optional PyTorch allocator cap when sharing the evaluation GPU.
  cuda_memory_fraction: null
  # Match the deterministic noise used by offline action-sampling validation.
  action_seed: 271828
  # Rectified-flow initial Gaussian scale.  Zero evaluates the deterministic
  # central trajectory and avoids re-sampling left/right modes every 10 steps.
  action_noise_scale: 1.0
  # Optional first-chunk speed seed in the goal-aligned action frame.
  bootstrap_forward_speed_mps: 0.0
  bootstrap_action_chunks: 0
  # Ablation for expert-history teacher forcing in Action-DiT.  Set false to
  # remove predicted-action feedback at deployment; it does not alter Lee.
  use_past_actions: auto
  # Optional debug capture; disabled for large batched evaluations.
  record_lidar: false
  replan_interval_steps: 10
  # Deterministic 3-D-reference-velocity adapter (used by corrected checkpoints).
  yaw_speed_threshold: 0.2
  max_yaw_rate: 2.5
  # Legacy checkpoints only: preserve the historical total-speed norm cap.
  # New Flow-only checkpoints use their recorded per-axis ego-FLU +/-2 m/s
  # limits instead; their total speed is NOT capped at 2 m/s.
  max_reference_speed: 2.0
  max_reference_acceleration: 6.0
  # Optional adapter-side terminal brake.  It does not alter Lee; when
  # enabled, a near-goal low-speed vehicle receives a zero target velocity so
  # the original Lee loop can satisfy the strict 0.5 m / 0.2 m/s stop window.
  goal_stop_adapter:
    enabled: false
    enter_distance_m: 1.0
    enter_speed_mps: 1.0
  safety_filter:
    enabled: false
    candidate_count: 31
    max_heading_offset_deg: 100.0
    corridor_radius_m: 0.65
    lookahead_m: 3.0
    vertical_half_extent_m: 0.6
    obstacle_cost: 4.0
    heading_cost: 0.35
    continuity_cost: 0.2
    boundary_margin_m: 0.8
    boundary_cost: 20.0
    stop_clearance_m: 0.45
    full_speed_clearance_m: 1.5
  metrics_path: training/lidar_WAM/outputs/super_history_world_action_dit_t1/closed_loop/metrics.json
  trajectory_path: training/lidar_WAM/outputs/super_history_world_action_dit_t1/closed_loop/trajectories.npz

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]
