defaults:
  - _self_
  - drone
  - ppo
  - sim

headless: true
gpu_id: 0
device: "cuda:${gpu_id}"
seed: 0

# "latest" selects the newest checkpoint under training_delay/wandb.
baseline_checkpoint: null
delay_checkpoint: latest

env:
  num_envs: 256
  max_episode_length: 2200
  env_spacing: 8.0
  num_obstacles: 350

env_dyn:
  num_obstacles: 80
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

eval:
  enabled: true
  # Fixed samples from the same independent start/target boundary distribution
  # used by training. Physics, observations and timing use the live train code.
  dataset_path: environments/fixed_scenarios.pt
  max_steps: 2200
  record_video: false
  video_dir: videos/random_delay
  result_dir: results/random_delay

timing:
  enabled: true
  mode: overlapping_transport
  sampling_mode: random_walk_steps
  command_sampling_mode: random_walk_steps
  command_publish_hz: 50.0
  # Keep both stages random while env.training is false.
  randomize_in_eval: true
  reference_dt: 0.016
  inference_delay:
    min: 0.016
    max: 0.096
    eval: 0.032
  command_delay:
    # Actor completion to controller application, including publisher wait.
    min: 0.060
    max: 0.150
    eval: 0.100
  change_probability: 0.2
  max_step_change: 1

viewer:
  eye: [0.0, 40.0, 40.0]
  lookat: [0.0, 2.5, 0.0]
  resolution: [960, 720]
