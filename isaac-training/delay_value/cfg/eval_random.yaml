defaults:
  - drone
  - ppo
  - sim
  - _self_

headless: true
gpu_id: 1
device: "cuda:${gpu_id}"
seed: 0

# Supply both checkpoints on the command line.
baseline_checkpoint: null
delay_checkpoint: null

env:
  num_envs: 1024
  max_episode_length: 2200
  env_spacing: 8.0
  num_obstacles: 200

env_dyn:
  num_obstacles: 0
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

eval:
  enabled: true
  policy: both
  # This file fixes only scenarios. Physics, rewards, observations and timing
  # all come from the delay_value NavigationEnv implementation.
  dataset_path: environments/fixed_scenarios.pt
  max_steps: 2200
  record_video: true
  video_dir: videos/random_delay
  result_dir: results/random_delay

timing:
  enabled: true
  mode: overlapping_transport
  # Keep both stages random while env.training is false.
  randomize_in_eval: true
  # Sample requested delays at 1 ms resolution. The policy-facing timing
  # features use floor(delay / reference_dt), while transport executes on ticks.
  continuous_in_eval: true
  delay_resolution: 0.001
  observation_quantization: floor
  # checkpoint_final.pt in training_delay uses the original 10-D state:
  # 8 base features plus inference and command delay.
  observation_state_dim: 10
  reference_dt: 0.016
  inference_delay:
    min: 0.016
    max: 0.096
    eval: 0.032
  command_delay:
    min: 0.016
    max: 0.032
    eval: 0.016
  change_probability: 0.2
  max_step_change: 1

# Evaluation-only 1 ms physics resolution makes integer-millisecond delays
# take effect at their requested time. A nominal policy interval remains 16 ms.
sim:
  dt: 0.001
  substeps: 16

viewer:
  eye: [0.0, 40.0, 40.0]
  lookat: [0.0, 2.5, 0.0]
  resolution: [960, 720]
