defaults:
  - drone
  - ppo
  - sim
  - _self_

headless: true
gpu_id: 1
device: "cuda:${gpu_id}"
seed: 0

# Supply both checkpoints on the command line.
baseline_checkpoint: null
delay_checkpoint: null

env:
  num_envs: 1024
  # 17,600 physical ticks * 2 ms retains the original 35.2 s horizon.
  max_episode_length: 17600
  actor_interval_steps: 50
  env_spacing: 8.0
  num_obstacles: 200

env_dyn:
  num_obstacles: 0
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

eval:
  enabled: true
  policy: both
  # Fixed scenarios; physics, observations, odom and FIFO reuse training_delay.
  dataset_path: environments/fixed_scenarios.pt
  # 352 policy transitions * 100 ms = 35.2 s.
  max_steps: 352
  record_video: false
  video_dir: videos/random_delay
  result_dir: results/random_delay

timing:
  enabled: true
  # Randomize the command publication-to-controller reception delay in eval.
  randomize_in_eval: true
  command_delay:
    distribution: uniform_ticks
    min: 0.002
    max: 0.004
    eval: 0.004

viewer:
  eye: [0.0, 40.0, 40.0]
  lookat: [0.0, 2.5, 0.0]
  resolution: [960, 720]
